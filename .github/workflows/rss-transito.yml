name: Actualizar RSS de tránsito
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar rss.xml
        env:
          FEED_URL: https://radiofmq.github.io/rss-transito/rss.xml
        run: python3 transito_rss.py rss.xml
      - name: Guardar cambios
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add rss.xml state.json
          git diff --cached --quiet || (git commit -m "Actualizar feed" && git push)
